<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>魔法小屋 Magic Cottage</title>
    <!-- 使用 Tailwind CSS 進行基礎排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* ============================================================
         * 1. 基礎展示頁面樣式 (滿版無留白覆蓋)
         * ============================================================ */
        body {
            /* 邊框色由 JS 依日夜更新;預設白日純白 */
            --edge-color: #ffffff;
            /* 引導光暈預設金黃(白天),JS 依日夜更新為金/藍 */
            --hint-c1-soft: rgba(245, 158, 11, 0.75);
            --hint-c2-soft: rgba(251, 191, 36, 0.45);
            --hint-c1-strong: rgba(245, 158, 11, 1);
            --hint-c2-strong: rgba(251, 191, 36, 0.85);
            /* 說明入口描邊 + 小卡配色(預設白天),JS 依日夜更新 */
            --help-stroke: #2a2520;
            --card-solid-bg: #ffffff;
            --card-solid-fg: #000000;
            --card-accent: #d99b1c;
            background-color: var(--edge-color);
            transition: background-color 0.6s ease;
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; /* 確保絕不出現滾動條 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* 房間容器:寬度永遠滿版(左右不留邊)，高度照 16:9 換算。 */
        .room-container {
            position: relative;
            width: 100vw;
            height: 56.25vw; /* 100vw * 9/16，嚴格 16:9，不變形 */
            flex-shrink: 0;
            overflow: hidden;
            background-color: #02040a;
        }

        /* 各互動元件防塌陷寬高比 (確保在圖片載入時仍維持比例穩定) */
        #switch-btn { aspect-ratio: 400 / 600; }
        #door-handle-btn { aspect-ratio: 800 / 400; }
        #pointer-img { aspect-ratio: 800 / 800; }
        #music-box-btn { aspect-ratio: 1 / 1; }
        #music-note-img { aspect-ratio: 1 / 1; }

        /* ============================================================
         * 2. 互動特效與動態動畫
         * ============================================================ */
        
        /* 門把點擊旋轉回彈動畫 - 恢復與 Prototype 一致的變換順序與變數結構 */
        @keyframes doorBounce {
            0% { transform: rotate(0deg) scale(1); }
            30% { transform: rotate(var(--click-rotation, 19.5deg)) scale(0.95); }
            70% { transform: rotate(-4deg) scale(1.02); }
            100% { transform: rotate(0deg) scale(1); }
        }
        .door-active {
            animation: doorBounce 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) both;
        }

        /* 音符精緻浮動、左右擺動與微微旋轉動畫 */
        @keyframes dynamicNoteAnimation {
            0% {
                transform: translateY(0px) translateX(0px) rotate(0deg);
            }
            25% {
                transform: translateY(calc(-1px * var(--float-amp, 10.5))) translateX(calc(1px * var(--sway-amp, 0))) rotate(calc(1deg * var(--rot-amp, 19.5)));
            }
            50% {
                transform: translateY(0px) translateX(0px) rotate(0deg);
            }
            75% {
                transform: translateY(calc(1px * var(--float-amp, 10.5))) translateX(calc(-1px * var(--sway-amp, 0))) rotate(calc(-1deg * var(--rot-amp, 19.5)));
            }
            100% {
                transform: translateY(0px) translateX(0px) rotate(0deg);
            }
        }
        .music-playing {
            animation: dynamicNoteAnimation var(--anim-speed, 3.5s) ease-in-out infinite;
        }

        /* 互動導覽：沿著 PNG 手繪透明邊緣的雙層呼吸微光。顏色由 --hint-c1/--hint-c2 變數控制,日金夜藍 */
        @keyframes pngGlowEffect {
            0%, 100% { 
                filter: drop-shadow(0 0 5px var(--hint-c1-soft)) drop-shadow(0 0 12px var(--hint-c2-soft)) brightness(1.05); 
            }
            50% { 
                filter: drop-shadow(0 0 12px var(--hint-c1-strong)) drop-shadow(0 0 30px var(--hint-c2-strong)) brightness(1.3); 
            }
        }
        .hint-glow {
            animation: pngGlowEffect 2.4s ease-in-out infinite;
            transition: filter 0.5s ease;
        }
        /* 說明卡重點字:顏色由 --card-accent 控制,日金夜藍 */
        #help-card strong {
            color: var(--card-accent);
            transition: color 0.5s ease;
        }
    </style>
</head>
<body>

    <!-- ============================================================
     * 3. 奇幻房間主要展示容器 (滿版、保持 16:9 覆蓋)
     * ============================================================ -->
    <div id="room-container" class="room-container transition-all">

        <!-- [9] 滑鼠墨線拖尾 (最上層,點擊穿透不擋互動) -->
        <canvas id="cursor-trail" class="absolute inset-0 w-full h-full pointer-events-none z-40"></canvas>

        <!-- [1] videoPlayer：最底層，放置窗外風景影片 -->
        <div id="video-player" class="absolute pointer-events-none overflow-hidden select-none z-10 transition-all">
            <video id="room-video" class="w-full h-full" autoplay muted loop playsinline></video>
        </div>

        <!-- [2] roomImage：中間層，完整覆蓋在影片上方 (視窗已挖空透明) -->
        <div id="room-image" class="absolute pointer-events-none select-none z-20 transition-all">
            <img id="room-image-img" class="w-full h-full object-fill" src="" alt="Room Background">
        </div>

        <!-- [2.5] cat：前景貓咪 (自發光透明 webm，疊在房間圖之上、互動按鈕之下) -->
        <div id="cat-video" class="absolute pointer-events-none select-none z-[25] transition-all">
            <video id="cat-video-el" class="w-full h-full object-contain" autoplay muted loop playsinline></video>
        </div>

        <!-- [3] switch：最上層互動元件 - 電燈開關 (切換日夜) -->
        <div id="switch-btn" class="absolute cursor-pointer select-none z-30 transition-all hover:scale-105 active:scale-95 duration-200">
            <!-- 加上 hint-glow 指引觀眾點擊 -->
            <img id="switch-img" class="w-full h-full object-contain hint-glow" src="" alt="Switch">
        </div>

        <!-- [4] doorHandle：最上層互動元件 - 門把 (切換景點風景) -->
        <div id="door-handle-btn" class="absolute cursor-pointer select-none z-30 transition-all hover:brightness-110">
            <!-- 加上 hint-glow 指引觀眾點擊 -->
            <img id="door-handle-img" class="w-full h-full object-contain hint-glow" src="" alt="Door Handle">
        </div>

        <!-- [5] pointer：最上層裝飾元件 - 計量針 (指向當前場景狀態) -->
        <div id="pointer-img" class="absolute pointer-events-none select-none z-30 transition-all duration-500 ease-out">
            <img id="pointer-img-img" class="w-full h-full object-contain" src="" alt="Pointer">
        </div>

        <!-- [6] musicBox：最上層互動元件 - 音樂播放底座 (播放與暫停音樂) -->
        <div id="music-box-btn" class="absolute cursor-pointer select-none z-30 transition-all hover:scale-105 active:scale-95 duration-200">
            <!-- 加上 hint-glow 指引觀眾點擊 -->
            <img id="music-box-img" class="w-full h-full object-contain hint-glow" src="" alt="Music Box">
        </div>

        <!-- [7] musicNote：浮動音符 (蓋在底座最上方，播放時啟用細緻 CSS 動畫) -->
        <div id="music-note-img" class="absolute pointer-events-none select-none z-[35]" style="transition-property: left, top, width, height;">
            <img id="music-note-img-img" class="w-full h-full object-contain" src="" alt="Music Note">
        </div>

        <!-- [8] 說明入口：左下角問號書本 (z-40，點擊彈出說明卡，日夜換圖) -->
        <div id="help-btn" class="absolute cursor-pointer select-none z-40 transition-transform hover:scale-110 active:scale-95"
             style="left: 2.2%; top: 77.6%; width: 9.9%;" title="使用說明">
            <img id="help-btn-img" class="w-full h-full object-contain" src="" alt="使用說明書本">
        </div>

        <!-- [8.5] 說明小卡：點擊入口後彈出 (z-50，背景模糊) -->
        <div id="help-overlay" class="absolute inset-0 z-50 hidden items-center justify-center"
             style="background: rgba(0,0,0,0.05); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);">
            <div id="help-card" class="relative transition-all"
                 style="width: 42%; max-width: 560px; padding: 3% 3.5%;
                        background: var(--card-solid-bg); color: var(--card-solid-fg);
                        border: 2px solid var(--card-solid-fg); border-radius: 14px;
                        box-shadow: 0 12px 40px rgba(0,0,0,0.4); font-family: Georgia, 'Noto Serif TC', serif;">
                <!-- 角落星芒裝飾 -->
                <svg viewBox="0 0 24 24" style="position:absolute; top:10px; left:12px; width:18px; height:18px;">
                    <path d="M12 1 L14 10 L23 12 L14 14 L12 23 L10 14 L1 12 L10 10 Z" fill="var(--card-solid-fg)" opacity="0.55"/>
                </svg>
                <svg viewBox="0 0 24 24" style="position:absolute; top:10px; right:12px; width:18px; height:18px;">
                    <path d="M12 1 L14 10 L23 12 L14 14 L12 23 L10 14 L1 12 L10 10 Z" fill="var(--card-solid-fg)" opacity="0.55"/>
                </svg>

                <!-- 關閉鈕 (往下移,不與右上星芒並排) -->
                <div id="help-close" class="absolute cursor-pointer"
                     style="top: 44px; right: 18px; font-size: 22px; line-height: 1; opacity: 0.6;">✕</div>

                <h2 style="text-align:center; font-size: 1.5em; font-weight: 700; margin: 0.2em 0 1em; letter-spacing: 1px;">
                    ✦ Welcome to Magic Cottage ✦
                </h2>
                <div style="font-size: 0.98em; line-height: 2; text-align: center; font-weight: 700;">
                    <p style="margin: 0.6em 0;">按 <strong>F11</strong> 進入全螢幕，沉浸感更佳</p>
                    <p style="margin: 0.6em 0;">點擊<strong>發光的物品</strong>，探索房間裡的互動</p>
                    <p style="margin: 0.6em 0;">點擊左下角的<strong>問號書本</strong>，可再次打開此說明</p>
                </div>
                <!-- 裝飾分隔線:魔法感星芒+菱形 -->
                <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin: 1.4em 0 0.4em; opacity:0.45;">
                    <span style="flex:0 0 auto; font-size:0.8em;">✦</span>
                    <span style="flex:0 1 150px; height:1px; background:var(--card-solid-fg);"></span>
                    <span style="flex:0 0 auto; font-size:0.7em;">◇</span>
                    <span style="flex:0 1 150px; height:1px; background:var(--card-solid-fg);"></span>
                    <span style="flex:0 0 auto; font-size:0.8em;">✦</span>
                </div>
                <div style="text-align:center; margin-top: 0.8em;">
                    <button id="help-process-btn"
                            style="cursor:pointer; font-family: inherit; font-size: 0.95em;
                                   padding: 0.5em 1.4em; border-radius: 999px;
                                   background: var(--card-solid-fg); color: var(--card-solid-bg);
                                   border: none; letter-spacing: 1px;">
                        ✦ 看看製作過程 ✦
                    </button>
                </div>
            </div>
        </div>

    </div>

    <!-- ============================================================
     * 4. JAVASCRIPT 核心互動邏輯與 CONFIG 設定
     * ============================================================ -->
    <script>
        // 集中式資源與資產路徑配置 (ASSETS)
        const ASSETS = {
            room: {
                day: "assets/room-day_2560x1440.png",
                night: "assets/room-night_2560x1440.png"
            },
            videos: {
                desert: {
                    day: "assets/desert-day.mp4",
                    night: "assets/desert-night.mp4"
                },
                ice: {
                    day: "assets/ice-day.mp4",
                    night: "assets/ice-night.mp4"
                }
            },
            switch: {
                day: "assets/switch-day_400x600.png",
                night: "assets/switch-night_400x600.png"
            },
            doorHandle: {
                day: "assets/door_handle-day_800x400.png",
                night: "assets/door_handle-night_800x400.png"
            },
            pointer: {
                day: "assets/pointer-day_800X800.png",
                night: "assets/pointer-night_800X800.png"
            },
            music: {
                desert: "assets/desert-music.mp3",
                ice: "assets/ice-music.mp3"
            },
            // 音樂底座與音符已完美更換為日夜雙版路徑
            musicBox: {
                day: "assets/music_box-day.png",
                night: "assets/music_box-night.png"
            },
            musicNote: {
                day: "assets/music_note-day.png",
                night: "assets/music_note-night.png"
            },
            // 前景貓咪：自發光透明 webm，日夜共用一支
            cat: "assets/cat.webm",
            // 說明書本：日夜兩版
            book: {
                day: "assets/book-day.png",
                night: "assets/book-night.png"
            }
        };

        // 最終調校完成之定位與動畫參數配置 (CONFIG)
        const CONFIG = {
            page: {
                maxRoomWidth: 1400
            },
            roomImage: {
                left: 0,
                top: 0,
                width: 100,
                height: 100
            },
            videoPlayer: {
                left: 17.7,
                top: 12.5,
                width: 51.8,
                aspectRatio: 1.7777777777777777,
                objectFit: "cover"
            },
            switch: {
                left: 6.61,
                top: 32.7,
                width: 7.5
            },
            doorHandle: {
                left: 76.57,
                top: 52.07,
                width: 14.23,
                transformOrigin: "50% 50%",
                clickRotation: 19.5
            },
            pointer: {
                left: 75.78,
                top: 13.44,
                width: 6.4,
                transformOrigin: "center center",
                desertRotation: 0,
                iceRotation: 180
            },
            musicBox: {
                left: 29.2,
                top: 65,
                width: 11.8,
                volume: 0.8
            },
            musicNote: {
                left: 33.25,
                top: 71.8,
                width: 3.4,
                transformOrigin: "15% 50%",
                floatAmp: 10.5,
                swayAmp: 0,
                rotAmp: 19.5,
                speed: 3.5
            },
            // 前景貓咪定位 (prototype 微調完成的數值)
            cat: {
                left: 48.1,
                top: 65.5,
                width: 21.8
            }
        };

        // 頁面狀態控制
        let currentState = {
            time: "day",          // day 或 night
            scene: "desert"       // desert 或 ice
        };

        // 音樂播放狀態控制
        let musicEnabled = false; 
        let audioObj = new Audio();
        audioObj.loop = true;

        /************************************************************
         * 5. 音效合成管理器 (SoundFX) - 使用 Web Audio API 即時產生高音質音效
         ************************************************************/
        const SoundFX = {
            ctx: null,
            
            // 啟用音訊上下文
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            },

            // [A] 日夜開關音效 - 機械式開關卡噠雙響 (Double Snap Switch Click)
            playSwitch() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;

                    const osc1 = this.ctx.createOscillator();
                    const gain1 = this.ctx.createGain();
                    osc1.type = 'triangle';
                    osc1.frequency.setValueAtTime(150, now);
                    osc1.frequency.exponentialRampToValueAtTime(40, now + 0.015);
                    
                    gain1.gain.setValueAtTime(0.3, now);
                    gain1.gain.exponentialRampToValueAtTime(0.0001, now + 0.015);
                    osc1.connect(gain1);
                    gain1.connect(this.ctx.destination);

                    const osc2 = this.ctx.createOscillator();
                    const gain2 = this.ctx.createGain();
                    osc2.type = 'sine';
                    osc2.frequency.setValueAtTime(600, now + 0.012);
                    osc2.frequency.exponentialRampToValueAtTime(150, now + 0.03);

                    gain2.gain.setValueAtTime(0, now);
                    gain2.gain.setValueAtTime(0.18, now + 0.012);
                    gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
                    osc2.connect(gain2);
                    gain2.connect(this.ctx.destination);

                    const bufferSize = this.ctx.sampleRate * 0.025;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const noise = this.ctx.createBufferSource();
                    noise.buffer = buffer;

                    const filter = this.ctx.createBiquadFilter();
                    filter.type = 'highpass';
                    filter.frequency.setValueAtTime(3000, now);

                    const noiseGain = this.ctx.createGain();
                    noiseGain.gain.setValueAtTime(0.05, now);
                    noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.02);

                    noise.connect(filter);
                    filter.connect(noiseGain);
                    noiseGain.connect(this.ctx.destination);

                    osc1.start(now);
                    osc1.stop(now + 0.02);
                    osc2.start(now + 0.012);
                    osc2.stop(now + 0.04);
                    noise.start(now);
                } catch (e) {
                    console.warn("無法即時合成開關音效: ", e);
                }
            },

            // [B] 門把下壓旋轉音效 - 金屬機械卡榫與彈簧釋放 (Metallic Creak & Latch)
            playDoorHandle() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;

                    const oscCreak = this.ctx.createOscillator();
                    const gainCreak = this.ctx.createGain();
                    const filterCreak = this.ctx.createBiquadFilter();

                    oscCreak.type = 'sawtooth';
                    oscCreak.frequency.setValueAtTime(60, now);
                    oscCreak.frequency.linearRampToValueAtTime(110, now + 0.1);

                    filterCreak.type = 'bandpass';
                    filterCreak.frequency.setValueAtTime(250, now);

                    gainCreak.gain.setValueAtTime(0, now);
                    gainCreak.gain.linearRampToValueAtTime(0.12, now + 0.02);
                    gainCreak.gain.exponentialRampToValueAtTime(0.001, now + 0.1);

                    oscCreak.connect(filterCreak);
                    filterCreak.connect(gainCreak);
                    gainCreak.connect(this.ctx.destination);

                    const oscLatch = this.ctx.createOscillator();
                    const gainLatch = this.ctx.createGain();
                    
                    oscLatch.type = 'triangle';
                    oscLatch.frequency.setValueAtTime(800, now + 0.08);
                    oscLatch.frequency.exponentialRampToValueAtTime(120, now + 0.14);

                    gainLatch.gain.setValueAtTime(0, now);
                    gainLatch.gain.setValueAtTime(0.25, now + 0.08);
                    gainLatch.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);

                    oscLatch.connect(gainLatch);
                    gainLatch.connect(this.ctx.destination);

                    const bufferSize = this.ctx.sampleRate * 0.04;
                    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < bufferSize; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    const clickNoise = this.ctx.createBufferSource();
                    clickNoise.buffer = buffer;

                    const filterNoise = this.ctx.createBiquadFilter();
                    filterNoise.type = 'bandpass';
                    filterNoise.frequency.setValueAtTime(4000, now + 0.08);

                    const gainNoise = this.ctx.createGain();
                    gainNoise.gain.setValueAtTime(0, now);
                    gainNoise.gain.setValueAtTime(0.04, now + 0.08);
                    gainNoise.gain.exponentialRampToValueAtTime(0.0001, now + 0.12);

                    clickNoise.connect(filterNoise);
                    filterNoise.connect(gainNoise);
                    gainNoise.connect(this.ctx.destination);

                    oscCreak.start(now);
                    oscCreak.stop(now + 0.11);
                    oscLatch.start(now + 0.08);
                    oscLatch.stop(now + 0.15);
                    clickNoise.start(now + 0.08);
                } catch (e) {
                    console.warn("無法即時合成門把音效: ", e);
                }
            },

            // [C] 音樂底座音效 - 八音盒鋼片撥弦共鳴聲 (Music Box Steel Pluck)
            playMusicBoxClick() {
                try {
                    this.init();
                    const now = this.ctx.currentTime;
                    
                    const oscBase = this.ctx.createOscillator();
                    const oscHarmonic1 = this.ctx.createOscillator();
                    const oscHarmonic2 = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    oscBase.type = 'sine';
                    oscBase.frequency.setValueAtTime(880, now);

                    oscHarmonic1.type = 'sine';
                    oscHarmonic1.frequency.setValueAtTime(1064.8, now);

                    oscHarmonic2.type = 'sine';
                    oscHarmonic2.frequency.setValueAtTime(2156, now);

                    gain.gain.setValueAtTime(0, now);
                    gain.gain.linearRampToValueAtTime(0.22, now + 0.002);
                    gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.45);

                    oscBase.connect(gain);
                    oscHarmonic1.connect(gain);
                    oscHarmonic2.connect(gain);
                    gain.connect(this.ctx.destination);

                    oscBase.start(now);
                    oscHarmonic1.start(now);
                    oscHarmonic2.start(now);

                    oscBase.stop(now + 0.5);
                    oscHarmonic1.stop(now + 0.5);
                    oscHarmonic2.stop(now + 0.5);
                } catch (e) {
                    console.warn("無法即時合成音樂底座音效: ", e);
                }
            }
        };

        /************************************************************
         * A. 套用 CONFIG 到 HTML 各元件樣式
         ************************************************************/
        function initLayoutStyles() {
            // 完全恢復最初的「滿版覆蓋」排版，移除任何視窗高寬限制
            const container = document.getElementById('room-container');
            container.style.width = "";
            container.style.maxWidth = "";

            // 房間背景底圖定位
            const roomImg = document.getElementById('room-image');
            roomImg.style.left = `${CONFIG.roomImage.left}%`;
            roomImg.style.top = `${CONFIG.roomImage.top}%`;
            roomImg.style.width = `${CONFIG.roomImage.width}%`;
            roomImg.style.height = `${CONFIG.roomImage.height}%`;

            // 窗外影片定位
            const videoPl = document.getElementById('video-player');
            videoPl.style.left = `${CONFIG.videoPlayer.left}%`;
            videoPl.style.top = `${CONFIG.videoPlayer.top}%`;
            videoPl.style.width = `${CONFIG.videoPlayer.width}%`;
            videoPl.style.aspectRatio = `${CONFIG.videoPlayer.aspectRatio}`;
            
            const videoEl = document.getElementById('room-video');
            videoEl.style.objectFit = CONFIG.videoPlayer.objectFit;

            // 開關定位
            const switchEl = document.getElementById('switch-btn');
            switchEl.style.left = `${CONFIG.switch.left}%`;
            switchEl.style.top = `${CONFIG.switch.top}%`;
            switchEl.style.width = `${CONFIG.switch.width}%`;

            // 門把定位與旋轉屬性設定
            const doorEl = document.getElementById('door-handle-btn');
            doorEl.style.left = `${CONFIG.doorHandle.left}%`;
            doorEl.style.top = `${CONFIG.doorHandle.top}%`;
            doorEl.style.width = `${CONFIG.doorHandle.width}%`;
            doorEl.style.transformOrigin = CONFIG.doorHandle.transformOrigin;
            // 修正為帶有 deg 單位的屬性值，與 CSS keyframe 的 var 配合
            doorEl.style.setProperty('--click-rotation', `${CONFIG.doorHandle.clickRotation}deg`);

            // 計量指針定位
            const pointerEl = document.getElementById('pointer-img');
            pointerEl.style.left = `${CONFIG.pointer.left}%`;
            pointerEl.style.top = `${CONFIG.pointer.top}%`;
            pointerEl.style.width = `${CONFIG.pointer.width}%`;
            pointerEl.style.transformOrigin = CONFIG.pointer.transformOrigin;

            // 音樂播放器底座定位
            const musicBoxEl = document.getElementById('music-box-btn');
            musicBoxEl.style.left = `${CONFIG.musicBox.left}%`;
            musicBoxEl.style.top = `${CONFIG.musicBox.top}%`;
            musicBoxEl.style.width = `${CONFIG.musicBox.width}%`;

            // 浮動音符定位與動畫參數設定
            const musicNoteEl = document.getElementById('music-note-img');
            musicNoteEl.style.left = `${CONFIG.musicNote.left}%`;
            musicNoteEl.style.top = `${CONFIG.musicNote.top}%`;
            musicNoteEl.style.width = `${CONFIG.musicNote.width}%`;
            musicNoteEl.style.transformOrigin = CONFIG.musicNote.transformOrigin;
            
            // 將 CONFIG 動畫參數轉換為無單位純數值，傳入 CSS keyframe 的 calc 當中運算
            musicNoteEl.style.setProperty('--float-amp', CONFIG.musicNote.floatAmp);
            musicNoteEl.style.setProperty('--sway-amp', CONFIG.musicNote.swayAmp);
            musicNoteEl.style.setProperty('--rot-amp', CONFIG.musicNote.rotAmp);
            musicNoteEl.style.setProperty('--anim-speed', `${CONFIG.musicNote.speed}s`);

            // 前景貓咪定位（地毯右側地板）
            const catEl = document.getElementById('cat-video');
            catEl.style.left = `${CONFIG.cat.left}%`;
            catEl.style.top = `${CONFIG.cat.top}%`;
            catEl.style.width = `${CONFIG.cat.width}%`;
            // 載入貓咪自發光透明影片（日夜共用）
            const catVideoEl = document.getElementById('cat-video-el');
            catVideoEl.src = ASSETS.cat;
            catVideoEl.play().catch(e => {
                console.warn("瀏覽器阻擋自動播放貓咪影片，屬正常安全政策：", e);
            });

            // 設定預設音訊音量
            audioObj.volume = CONFIG.musicBox.volume;
        }

        /************************************************************
         * B. 切換資源與多媒體（圖片與影片更新）
         ************************************************************/
        function updateMedia() {
            const time = currentState.time;
            const scene = currentState.scene;

            // 0. 邊框色:日=純白、夜=純黑
            const EDGE_COLORS = { day: "#ffffff", night: "#000000" };
            document.body.style.setProperty('--edge-color', EDGE_COLORS[time]);

            // 0.5 互動引導光暈 + 滑鼠星星光暈:日=金、夜=藍
            const HINT = {
                day: {  // 金黃
                    c1soft: "rgba(245, 158, 11, 0.75)", c2soft: "rgba(251, 191, 36, 0.45)",
                    c1strong: "rgba(245, 158, 11, 1)",  c2strong: "rgba(251, 191, 36, 0.85)"
                },
                night: {  // 魔法藍
                    c1soft: "rgba(96, 165, 250, 0.75)", c2soft: "rgba(147, 197, 253, 0.5)",
                    c1strong: "rgba(96, 165, 250, 1)",  c2strong: "rgba(191, 219, 254, 0.9)"
                }
            };
            const hint = HINT[time];
            const rootStyle = document.body.style;
            rootStyle.setProperty('--hint-c1-soft', hint.c1soft);
            rootStyle.setProperty('--hint-c2-soft', hint.c2soft);
            rootStyle.setProperty('--hint-c1-strong', hint.c1strong);
            rootStyle.setProperty('--hint-c2-strong', hint.c2strong);

            // 0.6 小卡配色:日(純白底黑字) / 夜(純黑底白字),重點字日金夜藍
            if (time === "night") {
                rootStyle.setProperty('--card-solid-bg', '#000000');
                rootStyle.setProperty('--card-solid-fg', '#ffffff');
                rootStyle.setProperty('--card-accent', '#60a5fa');  // 夜:藍
            } else {
                rootStyle.setProperty('--card-solid-bg', '#ffffff');
                rootStyle.setProperty('--card-solid-fg', '#000000');
                rootStyle.setProperty('--card-accent', '#d99b1c');  // 日:金
            }

            // 1. 更換各圖層對應之日夜圖片
            document.getElementById('room-image-img').src = ASSETS.room[time];
            document.getElementById('switch-img').src = ASSETS.switch[time];
            document.getElementById('door-handle-img').src = ASSETS.doorHandle[time];
            document.getElementById('pointer-img-img').src = ASSETS.pointer[time];
            
            // 2. 更換音樂播放器底座與音符對應之日夜版本圖片
            document.getElementById('music-box-img').src = ASSETS.musicBox[time];
            document.getElementById('music-note-img-img').src = ASSETS.musicNote[time];

            // 說明書本日夜切換
            document.getElementById('help-btn-img').src = ASSETS.book[time];

            // 3. 切換窗外風景影片播放路徑
            const videoEl = document.getElementById('room-video');
            const targetVideoPath = ASSETS.videos[scene][time];
            
            if (videoEl.getAttribute('data-active-src') !== targetVideoPath) {
                videoEl.setAttribute('data-active-src', targetVideoPath);
                videoEl.src = targetVideoPath;
                videoEl.load();
                videoEl.play().catch(e => {
                    console.warn("瀏覽器阻擋自動播放窗外背景影片，此屬正常安全政策保護範疇：", e);
                });
            }

            // 4. 更新指針角度旋轉
            updatePointerRotation();
        }

        // 依據目前 Scene 角度旋轉指針
        function updatePointerRotation() {
            const pointerEl = document.getElementById('pointer-img');
            const targetRotation = currentState.scene === "desert" 
                ? CONFIG.pointer.desertRotation 
                : CONFIG.pointer.iceRotation;
            
            pointerEl.style.transform = `rotate(${targetRotation}deg)`;
        }

        /************************************************************
         * C. 音樂播放器控制邏輯 (Play & Pause & Sync)
         ************************************************************/
        function handleMusicPlay() {
            const scene = currentState.scene;
            const targetMusicPath = ASSETS.music[scene];

            // 若音源路徑改變則進行切換
            if (!audioObj.src.endsWith(targetMusicPath)) {
                audioObj.src = targetMusicPath;
            }

            audioObj.play().then(() => {
                // 音符套用 CSS 動畫進行飄逸、搖動與微旋轉
                document.getElementById('music-note-img').classList.add('music-playing');
            }).catch(err => {
                console.warn("音訊播放受阻 (常發生於使用者未有點擊行為時切換場景)：", err);
                musicEnabled = false;
                document.getElementById('music-note-img').classList.remove('music-playing');
            });
        }

        function handleMusicPause() {
            audioObj.pause();
            document.getElementById('music-note-img').classList.remove('music-playing');
        }

        /************************************************************
         * D. 互動事件監聽綁定
         ************************************************************/
        function bindInteractiveEvents() {
            
            // 1. 點擊電燈開關 (Switch) -> 日夜切換
            const switchBtn = document.getElementById('switch-btn');
            switchBtn.addEventListener('click', () => {
                currentState.time = currentState.time === "day" ? "night" : "day";
                
                // 播放清脆的機械式按鈕開關音效
                SoundFX.playSwitch();
                
                // 移除魔法引導微光
                document.getElementById('switch-img').classList.remove('hint-glow');

                updateMedia();
            });

            // 2. 點擊門把 (Door Handle) -> 風景切換、指針旋轉與門把反彈動態
            const doorBtn = document.getElementById('door-handle-btn');
            doorBtn.addEventListener('click', () => {
                currentState.scene = currentState.scene === "desert" ? "ice" : "desert";
                
                // 播放把手下壓扭轉彈簧與金屬卡榫咬合聲
                SoundFX.playDoorHandle();

                // 移除魔法引導微光
                document.getElementById('door-handle-img').classList.remove('hint-glow');

                // 門把反彈回動動畫
                doorBtn.classList.remove('door-active');
                void doorBtn.offsetWidth; // 強制瀏覽器重繪以重新觸發 Keyframe
                doorBtn.classList.add('door-active');

                updateMedia();

                // 若音樂處於播放狀態 (musicEnabled = true)，同步切換場景音樂
                if (musicEnabled) {
                    handleMusicPlay();
                }
            });

            // 移除門把動畫 class 確保下次點擊還能再次播放
            doorBtn.addEventListener('animationend', () => {
                doorBtn.classList.remove('door-active');
            });

            // 3. 點擊音樂底座 (Music Box) -> 播放與暫停音樂
            const musicBoxBtn = document.getElementById('music-box-btn');
            musicBoxBtn.addEventListener('click', () => {
                
                // 播放發條微小清脆的叩擊聲
                SoundFX.playMusicBoxClick();

                // 移除魔法引導微光
                document.getElementById('music-box-img').classList.remove('hint-glow');

                if (!musicEnabled) {
                    musicEnabled = true;
                    handleMusicPlay();
                } else {
                    musicEnabled = false;
                    handleMusicPause();
                }
            });
        }

        /************************************************************
         * E. 頁面初始化
         ************************************************************/
        /************************************************************
         * F. 影片預載入：頁面載入後在背景預抓所有場景影片，
         *    讓使用者切換日夜/場景時影片已在快取，零等待不卡頓。
         ************************************************************/
        function preloadAllVideos() {
            const videoPaths = [];
            // 收集所有場景影片路徑 (desert/ice 的 day/night)
            for (const scene in ASSETS.videos) {
                for (const time in ASSETS.videos[scene]) {
                    videoPaths.push(ASSETS.videos[scene][time]);
                }
            }
            // 也預載貓咪影片
            if (ASSETS.cat) videoPaths.push(ASSETS.cat);

            // 用隱藏的 video 元素逐一預抓(preload=auto 會下載並快取)
            videoPaths.forEach(path => {
                const v = document.createElement('video');
                v.preload = 'auto';
                v.muted = true;
                v.src = path;
                v.style.display = 'none';
                // 抓進快取後即可移除元素(快取保留)
                v.addEventListener('canplaythrough', () => {
                    v.remove();
                }, { once: true });
                v.load();
                document.body.appendChild(v);
            });
        }

        /************************************************************
         * G. 滑鼠四角星粒子：游標移動時冒出小四角星(✦)，閃爍後縮小淡出。
         *    黑白跟著日夜(日=深色、夜=白)，canvas 繪製、點擊穿透。
         ************************************************************/
        function initCursorTrail() {
            const canvas = document.getElementById('cursor-trail');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('room-container');

            function resizeCanvas() {
                const rect = container.getBoundingClientRect();
                const dpr = window.devicePixelRatio || 1;
                canvas.width = rect.width * dpr;
                canvas.height = rect.height * dpr;
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            let stars = [];
            const STAR_LIFE = 0.9;      // 每顆星存活秒數
            const SPAWN_GAP = 28;       // 游標移動多少距離冒一顆(越小越密)
            const MAX_SIZE = 7;         // 星星最大半徑(px)
            let lastSpawn = null;

            // 本體與光暈都黑白(日:墨星墨光 / 夜:白星白光)
            function getStarColor() {
                return currentState.time === "night"
                    ? { body: "250, 250, 248", glow: "255, 255, 255" }  // 夜:白星發白光
                    : { body: "30, 25, 20",    glow: "20, 15, 10" };    // 日:墨星發墨光
            }

            // 畫一顆會發光的四角星
            function drawStar(cx, cy, r, rot, col, a) {
                const inner = r * 0.32;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(rot);
                // 發光:用 shadowBlur 製造光暈
                ctx.shadowColor = `rgba(${col.glow}, ${a})`;
                ctx.shadowBlur = r * 2.2;
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const ang = (Math.PI / 2) * i;
                    ctx.lineTo(Math.cos(ang) * r, Math.sin(ang) * r);
                    ctx.lineTo(Math.cos(ang + Math.PI / 4) * inner, Math.sin(ang + Math.PI / 4) * inner);
                }
                ctx.closePath();
                ctx.fillStyle = `rgba(${col.body}, ${a})`;
                // 畫兩次強化發光(光暈疊加更明顯)
                ctx.fill();
                ctx.fill();
                ctx.restore();
            }

            // 游標移動:累積距離,每隔 SPAWN_GAP 冒一顆星(位置帶點隨機,更自然)
            container.addEventListener('mousemove', (e) => {
                const rect = container.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                if (!lastSpawn) { lastSpawn = { x, y }; return; }
                const dist = Math.hypot(x - lastSpawn.x, y - lastSpawn.y);
                if (dist >= SPAWN_GAP) {
                    stars.push({
                        x: x + (Math.random() - 0.5) * 10,
                        y: y + (Math.random() - 0.5) * 10,
                        age: 0,
                        size: MAX_SIZE * (0.6 + Math.random() * 0.4), // 大小略隨機
                        rot: Math.random() * Math.PI,                  // 角度隨機
                    });
                    lastSpawn = { x, y };
                }
            });

            // 點擊綻放:點擊位置冒 6 顆星往外散開、快速淡出(克制版)
            container.addEventListener('click', (e) => {
                const rect = container.getBoundingClientRect();
                const cx = e.clientX - rect.left;
                const cy = e.clientY - rect.top;
                const BURST = 6;
                for (let i = 0; i < BURST; i++) {
                    const ang = (Math.PI * 2 / BURST) * i + Math.random() * 0.5;
                    const speed = 60 + Math.random() * 40; // 往外飛的速度(px/秒)
                    stars.push({
                        x: cx, y: cy,
                        age: 0,
                        size: MAX_SIZE * (0.7 + Math.random() * 0.5),
                        rot: Math.random() * Math.PI,
                        vx: Math.cos(ang) * speed,   // 綻放星星有速度,會往外飛
                        vy: Math.sin(ang) * speed,
                    });
                }
            });

            let lastTime = performance.now();
            function draw(now) {
                const dt = (now - lastTime) / 1000;
                lastTime = now;
                const rect = container.getBoundingClientRect();
                ctx.clearRect(0, 0, rect.width, rect.height);

                stars.forEach(s => s.age += dt);
                stars = stars.filter(s => s.age < STAR_LIFE);

                const col = getStarColor();
                stars.forEach(s => {
                    // 綻放星星(有速度)會往外飛,並逐漸減速
                    if (s.vx !== undefined) {
                        s.x += s.vx * dt;
                        s.y += s.vy * dt;
                        s.vx *= 0.92;  // 減速,飛出去後慢下來
                        s.vy *= 0.92;
                    }
                    const t = s.age / STAR_LIFE;        // 0→1 生命進度
                    // 閃爍感:先快速放大冒出,再縮小淡出
                    const scale = t < 0.25 ? (t / 0.25) : (1 - (t - 0.25) / 0.75);
                    const alpha = (t < 0.25 ? (t / 0.25) : (1 - (t - 0.25) / 0.75)) * 0.95;
                    // 緩慢自轉,增加靈動感
                    const rot = s.rot + s.age * 1.2;
                    drawStar(s.x, s.y, s.size * scale, rot, col, Math.max(0, alpha));
                });
                requestAnimationFrame(draw);
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('DOMContentLoaded', () => {
            // 初始化套用 CONFIG 位置 (改回完全滿版覆蓋)
            initLayoutStyles();

            // 載入預設時段與場景多媒體 (Time: Day / Scene: Desert)
            updateMedia();

            // 綁定各控制圖層點擊互動事件
            bindInteractiveEvents();

            // 背景預載所有影片(在初始畫面顯示後才開始,不影響首屏)
            preloadAllVideos();

            // 啟動滑鼠星星特效
            initCursorTrail();

            // 說明小卡：開 / 關 / 製作過程按鈕
            const helpBtn = document.getElementById('help-btn');
            const helpOverlay = document.getElementById('help-overlay');
            const helpClose = document.getElementById('help-close');
            const helpProcessBtn = document.getElementById('help-process-btn');

            function openHelp() {
                helpOverlay.classList.remove('hidden');
                helpOverlay.style.display = 'flex';
            }
            function closeHelp() {
                helpOverlay.classList.add('hidden');
                helpOverlay.style.display = 'none';
            }
            helpBtn.addEventListener('click', (e) => { e.stopPropagation(); openHelp(); });
            helpClose.addEventListener('click', (e) => { e.stopPropagation(); closeHelp(); });
            // 點卡片外的遮罩也關閉
            helpOverlay.addEventListener('click', (e) => {
                if (e.target === helpOverlay) closeHelp();
            });
            // 網頁載入時預設展開說明卡(開場引導)
            openHelp();
            // 製作過程按鈕：之後接上頁面連結(把下面的 # 換成你的網址即可)
            helpProcessBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                window.open("making_of.html", "_blank");
            });

            // 網頁首次任意點擊時解鎖部分瀏覽器的音訊政策
            window.addEventListener('click', () => {
                SoundFX.init();
                if (musicEnabled && audioObj.paused) {
                    audioObj.play().catch(() => {});
                }
            }, { once: true });
        });
    </script>
</body>
